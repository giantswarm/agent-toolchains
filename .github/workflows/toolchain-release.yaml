# yamllint disable rule:truthy
# Auto Release per toolchain, kept by hand: devctl's generated Auto Release
# releases a repository as one un-prefixed v* line, while every
# toolchains/<name>/ directory here is an image with its own <name>/vX.Y.Z
# line. The file is not called auto-release.yaml: devctl's alignment deletes
# that name as a leftover of its own release flow.
#
# On every push to main, each toolchain whose directory, or the shared build
# scripts in toolchains/lib/, changed since its latest <name>/v* tag gets its
# next tag and a GitHub Release. The merged
# pull request's squash subject sets the bump: a breaking change (`type!:` or
# a `BREAKING CHANGE` footer) the major, a `feat` the minor, anything else the
# patch; a toolchain's first tag is v0.1.0. Diffing against the toolchain's
# own last tag, not just the pushed commit, lets a failed or skipped run catch
# up on the next one. The tag push starts the CircleCI tag pipeline
# (.circleci/generate-config.sh), which runs the toolchain contract check and
# then publishes the image to gsoci.azurecr.io under its version and `latest`.
name: Toolchain release

on:
  push:
    branches:
      - main
  # Re-runs the same detection, e.g. after a failed run.
  workflow_dispatch: {}

permissions:
  contents: write       # push tags and create the GitHub Releases

concurrency:
  group: toolchain-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag and release changed toolchains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          message=$(git log -1 --format=%B HEAD)
          subject=$(head -1 <<<"$message")
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subject" || grep -q '^BREAKING[ -]CHANGE' <<<"$message"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subject"; then
            bump=minor
          else
            bump=patch
          fi
          echo "bump from the squash subject: ${bump}"

          for dir in $(find toolchains -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null | sort); do
            name="${dir#toolchains/}"
            latest=$(git tag -l "${name}/v*" --sort=-v:refname \
              | grep -E "^${name}/v[0-9]+\.[0-9]+\.[0-9]+$" | head -1 || true)

            if [ -z "$latest" ]; then
              next="${name}/v0.1.0"
            elif git diff --quiet "$latest" HEAD -- "$dir" toolchains/lib; then
              echo "${dir}: unchanged since ${latest}"
              continue
            else
              IFS='.' read -r major minor patch <<< "${latest#"${name}"/v}"
              case "$bump" in
                major) next="${name}/v$((major + 1)).0.0" ;;
                minor) next="${name}/v${major}.$((minor + 1)).0" ;;
                *)     next="${name}/v${major}.${minor}.$((patch + 1))" ;;
              esac
            fi

            echo "${dir}: releasing ${next}"
            # One tag per push: CircleCI starts one pipeline per tag event.
            git tag "$next"
            git push origin "refs/tags/${next}"
            notes=(--generate-notes)
            [ -z "$latest" ] || notes+=(--notes-start-tag "$latest")
            gh release create "$next" --title "$next" --verify-tag "${notes[@]}"
            sleep 2
          done
